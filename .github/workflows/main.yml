name: Build DropKnife Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        dotnet-quality: 'preview' # 🎯 確保 GitHub 能抓到預覽版的 .NET 10 SDK

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DropKnife-Plugin
        path: bin/Release/net10.0/DropKnife.dll # 🎯 精準對齊 .NET 10 的輸出路徑
